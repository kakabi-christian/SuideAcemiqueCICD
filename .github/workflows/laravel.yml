name: Laravel CI

on:
  push:
    # Correction de "develo" en "develop"
    branches: [ "feature/initialize", "master", "develop" ]
  pull_request:
    branches: [ "feature/initialize", "master", "develop" ]

env:
  # Force l'utilisation de Node 24 pour supprimer l'avertissement de dépréciation
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl, sqlite3
        coverage: none

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Generate key
      run: php artisan key:generate

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Create Database
      run: |
        mkdir -p database
        touch database/database.sqlite

    - name: Execute tests
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      # Utilise "php artisan test" pour un affichage clair des erreurs dans la console GitHub
      run: php artisan test
